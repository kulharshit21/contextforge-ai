name: Feature request
description: Propose a user problem and a practical improvement
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow limitation with a real example.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested behavior
      description: Explain how a user would interact with the feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: Include privacy, portability, maintenance, and offline behavior considerations.
